{"id":"121329","type":"Bug","title":"Account Assignment Ruleset: Update error message received when Account Type parents are not setup","assignedTo":"Yamini Karthick","createdBy":"Shane O'Halloran","severity":"4 - Low","state":"Closed","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_Dataverse"},{"id":"118952","type":"User Story","title":"Model IQ / CECL | Account Assignment | New Assignment Method: Use Call Code","assignedTo":"Shane O'Halloran","createdBy":"Shane O'Halloran","severity":"","state":"Resolved","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_CECL"},{"id":"118951","type":"User Story","title":"Model IQ / CECL | Account Assignment | New Assignment Value: CECLAccountNum","assignedTo":"Shane O'Halloran","createdBy":"Shane O'Halloran","severity":"","state":"Resolved","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_CECL"},{"id":"118949","type":"User Story","title":"Model IQ / CECL | New Data Source Type: ChargeOff/Recovery | Import Fields and Validations","assignedTo":"Sam Horgan","createdBy":"Shane O'Halloran","severity":"","state":"Resolved","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_CECL"},{"id":"118948","type":"User Story","title":"Model IQ / CECL | New Data Source Type: ChargeOff/Recovery | Create Data Source","assignedTo":"Sam Horgan","createdBy":"Shane O'Halloran","severity":"","state":"Resolved","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_CECL"},{"id":"118947","type":"User Story","title":"Model IQ / CECL | New Data Source Type: ChargeOff/Recovery | DB Tables","assignedTo":"Sam Horgan","createdBy":"Shane O'Halloran","severity":"","state":"Resolved","tags":"DV_Prod_CECL_Release_2026; RequestingProduct_CECL"}];/*__RAW_END__*/

function getProduct(tags){
  const m=tags.match(/RequestingProduct_(\w+)/);
  return m?m[1]:'Unknown';
}

const ID_CAT={
  '118951':'Account Assignment','118952':'Account Assignment','123612':'Account Assignment',
  '121329':'Account Assignment','133453':'Customer Reported',
  '139700':'Platform & Infrastructure','140110':'Platform & Infrastructure',
  '93940':'Data Import Core','139896':'Data Import Core','139341':'Multi Period Upload',
  '136780':'Adjusted GL & Transactions','141265':'Data Import Core',
  '139917':'Platform & Infrastructure','145344':'Data Import Core',
  '136189':'Import Validation & Field Bugs','136848':'Import Validation & Field Bugs',
  '144679':'Import Validation & Field Bugs','141427':'Import Validation & Field Bugs',
  '145951':'Data Import Core','145929':'Data Import Core',
  '139275':'GL Recon',
};

const RULES=[
  {cat:'Multi Period Upload',test:t=>/multi.?period|muti.?period/i.test(t)},
  {cat:'CECL - ChargeOff/Recovery',test:t=>/charge.?off|recovery/i.test(t)},
  {cat:'Account Assignment',test:t=>/account.?assignment|CECLAccountNum|call.?code/i.test(t)},
  {cat:'Model IQ / CECL - New Fields & Modules',test:t=>/model.?iq.*data.?import|cecl.*data.?import|model.?iq.*CECL|connect.*cecl|connect.*model.?iq|changes.*cecl.*required|investments.*data/i.test(t)||(t.startsWith('Model IQ / CECL')&&!/account.?assignment/i.test(t))},
  {cat:'Import Validation & Field Bugs',test:t=>/validation|import.*fail/i.test(t)},
  {cat:'Data Import Core',test:t=>/import|data.?source/i.test(t)},
  {cat:'Platform & Infrastructure',test:t=>/pendo|app.?switcher|validation.?split|bi.?refresh/i.test(t)},
];

function classify(id,title,tags){
  if(ID_CAT[id])return ID_CAT[id];
  for(const r of RULES){
    if(r.test(title,tags||''))return r.cat;
  }
  return 'Other';
}

const DATA=[];
const seen=new Set();
RAW.forEach(item=>{
  if(seen.has(item.id))return;
  seen.add(item.id);
  const product=getProduct(item.tags);
  const category=classify(item.id,item.title,item.tags);
  DATA.push({...item,product,category,createdBy:item.createdBy||'',severity:item.severity||''});
});
DATA.sort((a,b)=>parseInt(b.id)-parseInt(a.id));

document.getElementById('total-count').textContent=DATA.length;

const isDone=s=>['Closed','Resolved'].includes(s);
const isTest=s=>['Test','Fully in Test','QA Backlog','Ready for Testing'].includes(s);

const types={},states={},products={},assignees={},creators={},severities={},categories={};
DATA.forEach(d=>{
  types[d.type]=(types[d.type]||0)+1;
  states[d.state]=(states[d.state]||0)+1;
  products[d.product]=(products[d.product]||0)+1;
  categories[d.category]=(categories[d.category]||0)+1;
  if(d.assignedTo)assignees[d.assignedTo]=(assignees[d.assignedTo]||0)+1;
  if(d.createdBy)creators[d.createdBy]=(creators[d.createdBy]||0)+1;
  if(d.severity)severities[d.severity]=(severities[d.severity]||0)+1;
});

const doneCount=DATA.filter(d=>isDone(d.state)).length;
const testCount=DATA.filter(d=>isTest(d.state)).length;
const openCount=DATA.length-doneCount-testCount;
const sb=document.getElementById('stats-bar');
sb.innerHTML=`<div class="stat"><div class="val">${DATA.length}</div><div class="lbl">Total Items</div></div>`+
  Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const c=k==='Bug'?'r':k==='User Story'?'g':k==='Task'?'b':'';
    return `<div class="stat"><div class="val ${c}">${v}</div><div class="lbl">${k}s</div></div>`;
  }).join('')+
  `<div class="stat" style="border-left:2px solid var(--border);padding-left:20px"><div class="val g">${doneCount}</div><div class="lbl">Completed</div></div>`+
  `<div class="stat"><div class="val b">${testCount}</div><div class="lbl">In Test</div></div>`+
  `<div class="stat"><div class="val o">${openCount}</div><div class="lbl">Open</div></div>`;

['f-type','f-state','f-product','f-assigned','f-createdBy','f-severity','f-category'].forEach(id=>{
  const sel=document.getElementById(id);
  const src=id==='f-type'?types:id==='f-state'?states:id==='f-product'?products:id==='f-category'?categories:id==='f-createdBy'?creators:id==='f-severity'?severities:assignees;
  Object.keys(src).sort().forEach(k=>{
    const o=document.createElement('option');
    o.value=k;o.textContent=`${k} (${src[k]})`;
    sel.appendChild(o);
  });
});

const stateClass=s=>['Closed','Resolved'].includes(s)?s:['Test','Fully in Test','QA Backlog','Ready for Testing'].includes(s)?'Test':['New','Dev Backlog','Bug Backlog'].includes(s)?'New':['Under Review','Blocked','Planning','Need More Info','Deferred'].includes(s)?'New':s==='Development'?'Development':'default';
const typeClass=t=>t.replace(/\s/g,'');
const prodClass=p=>['ModelIQ','Prof','CECL','Dataverse','Planning'].includes(p)?p:'default';
const sevClass=s=>{const n=s?s.charAt(0):'';return n>='1'&&n<='4'?'sev'+n:'';};
const sevLabel=s=>s||'—';

const collapsedGroups=new Set();

function toggleGroup(name){
  if(collapsedGroups.has(name))collapsedGroups.delete(name);else collapsedGroups.add(name);
  render();
}

function rowHtml(d){
  return `<tr>
    <td class="id-cell"><a href="${ADO}${d.id}" target="_blank" rel="noopener">#${d.id}</a></td>
    <td><span class="type-pill ${typeClass(d.type)}">${d.type}</span></td>
    <td class="title-cell">${d.title}</td>
    <td><span class="state-pill ${stateClass(d.state)}">${d.state}</span></td>
    <td><span class="product-tag ${prodClass(d.product)}">${d.product}</span></td>
    <td class="assigned-cell">${d.assignedTo||'—'}</td>
    <td class="assigned-cell">${d.createdBy||'—'}</td>
    <td>${d.severity?`<span class="severity-pill ${sevClass(d.severity)}">${sevLabel(d.severity)}</span>`:d.type==='Bug'?'—':''}</td>
    <td style="font-size:11px;color:var(--grey)">${d.category}</td>
  </tr>`;
}

function groupHeaderHtml(name,items){
  const done=items.filter(d=>isDone(d.state)).length;
  const test=items.filter(d=>isTest(d.state)).length;
  const open=items.length-done-test;
  const total=items.length;
  const w=140;
  const dw=Math.round(done/total*w);
  const tw=Math.round(test/total*w);
  const ow=w-dw-tw;
  const collapsed=collapsedGroups.has(name);
  return `<tr class="group-row ${collapsed?'collapsed':''}" onclick="toggleGroup('${name.replace(/'/g,"\\'")}')">
    <td colspan="9">
      <i class="fa-solid fa-chevron-down group-chevron"></i>
      <span class="group-title">${name}</span>
      <span class="group-count">${total}</span>
      <span class="group-progress">
        <span class="gp-bar gp-done" style="width:${dw}px" title="${done} done"></span>
        <span class="gp-bar gp-test" style="width:${tw}px" title="${test} in test"></span>
        <span class="gp-bar gp-open" style="width:${ow}px" title="${open} open"></span>
        <span class="gp-label">${done}/${total} done</span>
      </span>
    </td>
  </tr>`;
}

function render(){
  const q=document.getElementById('f-search').value.toLowerCase();
  const ft=document.getElementById('f-type').value;
  const fs=document.getElementById('f-state').value;
  const fp=document.getElementById('f-product').value;
  const fa=document.getElementById('f-assigned').value;
  const fcb=document.getElementById('f-createdBy').value;
  const fsev=document.getElementById('f-severity').value;
  const fc=document.getElementById('f-category').value;
  const fcomp=document.getElementById('f-completion').value;
  const gb=document.getElementById('f-groupby').value;
  const filtered=DATA.filter(d=>{
    if(ft&&d.type!==ft)return false;
    if(fs&&d.state!==fs)return false;
    if(fp&&d.product!==fp)return false;
    if(fa&&d.assignedTo!==fa)return false;
    if(fcb&&d.createdBy!==fcb)return false;
    if(fsev&&d.severity!==fsev)return false;
    if(fc&&d.category!==fc)return false;
    if(fcomp==='done'&&!isDone(d.state))return false;
    if(fcomp==='test'&&!isTest(d.state))return false;
    if(fcomp==='open'&&(isDone(d.state)||isTest(d.state)))return false;
    if(fcomp==='notdone'&&isDone(d.state))return false;
    if(q&&!(d.id.includes(q)||d.title.toLowerCase().includes(q)||(d.assignedTo||'').toLowerCase().includes(q)||(d.createdBy||'').toLowerCase().includes(q)||d.product.toLowerCase().includes(q)||d.category.toLowerCase().includes(q)))return false;
    return true;
  });
  const tbody=document.getElementById('tbody');
  const nr=document.getElementById('no-results');
  document.getElementById('visible-count').textContent=filtered.length;
  if(!filtered.length){tbody.innerHTML='';nr.style.display='';return;}
  nr.style.display='none';

  if(!gb){
    tbody.innerHTML=filtered.map(rowHtml).join('');
    return;
  }

  const groups={};
  filtered.forEach(d=>{
    const key=d[gb]||'Unassigned';
    (groups[key]=groups[key]||[]).push(d);
  });

  const catOrder=['CECL - ChargeOff/Recovery','Model IQ / CECL - New Fields & Modules','Account Assignment','Import Validation & Field Bugs','Data Import Core','Multi Period Upload','GL Recon','Adjusted GL & Transactions','Platform & Infrastructure','Customer Reported','Other'];
  const sortedKeys=Object.keys(groups).sort((a,b)=>{
    if(gb==='category'){
      const ia=catOrder.indexOf(a),ib=catOrder.indexOf(b);
      if(ia!==-1&&ib!==-1)return ia-ib;
      if(ia!==-1)return -1;if(ib!==-1)return 1;
    }
    return b.length-a.length||a.localeCompare(b);
  });

  let html='';
  for(const key of sortedKeys){
    const items=groups[key];
    html+=groupHeaderHtml(key,items);
    if(!collapsedGroups.has(key)){
      html+=items.map(rowHtml).join('');
    }
  }
  tbody.innerHTML=html;
}

['f-search','f-type','f-state','f-product','f-assigned','f-createdBy','f-severity','f-category','f-completion','f-groupby'].forEach(id=>{
  document.getElementById(id).addEventListener(id==='f-search'?'input':'change',render);
});

let sortCol='id',sortAsc=false;
document.querySelectorAll('thead th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}
    DATA.sort((a,b)=>{
      let va=a[col]||'',vb=b[col]||'';
      if(col==='id'){va=parseInt(va);vb=parseInt(vb);}
      else{va=va.toLowerCase();vb=vb.toLowerCase();}
      return sortAsc?(va>vb?1:-1):(va<vb?1:-1);
    });
    render();
  });
});

render();
</script>
